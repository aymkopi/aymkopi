<svg xmlns="http://www.w3.org/2000/svg" width="780" height="60" viewBox="0 0 780 60" role="img" aria-labelledby="title">
  <title id="title">Tech stack marquee</title>
  <style>
    .track { animation: scroll 54s linear infinite; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-3465px); } }
    @media (prefers-reduced-motion: reduce) { .track { animation: none; } }
    .ground { fill: #f6f8fa; }
    .outline { stroke: #d0d7de; }
    .chip { fill: #fff; stroke: #d0d7de; }
    text { fill: #24292f; font: 600 15px system-ui, sans-serif; dominant-baseline: middle; }
    .dot-0 { fill: #245bc4; }
    .dot-1 { fill: #17744c; }
    .dot-2 { fill: #754bb6; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #161b22; }
      .outline, .chip { stroke: #3d4857; }
      .chip { fill: #21262d; }
      text { fill: #ecf0f4; }
      .dot-0 { fill: #79a9ff; }
      .dot-1 { fill: #65cf95; }
      .dot-2 { fill: #c1a2ff; }
    }
  </style>
